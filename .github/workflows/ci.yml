name: CI - Dashboard Service

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-and-build:
    name: Lint, Type-Check, Tests & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dashboard Service
        uses: actions/checkout@v4
        with:
          path: repo/services/dashboard

      - name: Checkout Shared Contracts
        uses: actions/checkout@v4
        with:
          repository: Lotso-trading/shared
          path: repo/packages/shared
          ref: ${{ github.ref_name == 'main' && 'main' || 'develop' }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint (Biome)
        working-directory: repo/services/dashboard
        run: deno task lint

      - name: Type-Check (deno check)
        working-directory: repo/services/dashboard
        run: deno task check

      - name: Run Unit Tests
        working-directory: repo/services/dashboard
        run: deno task test

      - name: Build Vite for Production
        working-directory: repo/services/dashboard
        run: deno task build

      - name: Verify Distribution Output
        working-directory: repo/services/dashboard
        run: |
          test -f dist/index.html || (echo "dist/index.html is missing!" && exit 1)
          echo "✅ Production bundle dist/index.html successfully generated."
